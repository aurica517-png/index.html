<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amber — Official Page</title>
  <meta name="description" content="The official home of Amber. Exclusive content, behind-the-scenes moments and personal messages.">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Amber — Official Page">
  <meta property="og:description" content="Exclusive content and personal messages.">
  <meta property="og:image" content="images/photo-05.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230d0b0a'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='%23c9a46a' font-family='serif'>A</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="agegate" class="agegate" hidden>
    <div class="agegate__box">
      <div class="agegate__badge">18+</div>
      <h2 id="ag-title"></h2>
      <p id="ag-text"></p>
      <div class="agegate__actions">
        <button id="ag-enter" class="btn btn--gold"></button>
        <a id="ag-leave" class="btn btn--ghost" href="#"></a>
      </div>
    </div>
  </div>

  <header class="nav" id="nav">
    <a href="#top" class="nav__logo" id="nav-logo"></a>
    <nav class="nav__links">
      <a href="#about">About</a>
      <a href="#perks">Perks</a>
      <a href="#gallery">Gallery</a>
      <a href="#faq">FAQ</a>
    </nav>
    <a class="btn btn--gold btn--sm" id="nav-cta" target="_blank" rel="noopener"></a>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero__img" id="hero-img"></div>
      <div class="hero__shade"></div>
      <div class="hero__content">
        <p class="eyebrow" id="hero-eyebrow"></p>
        <h1 id="hero-title"></h1>
        <p class="hero__text" id="hero-text"></p>
        <a class="btn btn--gold btn--lg" id="hero-cta" target="_blank" rel="noopener"></a>
        <p class="hero__sub" id="hero-sub"></p>
      </div>
    </section>

    <section class="section about" id="about">
      <div class="container about__grid">
        <figure class="about__photo"><img id="about-img" alt="" loading="lazy"></figure>
        <div class="about__copy">
          <p class="eyebrow">The woman behind the page</p>
          <h2 id="about-title"></h2>
          <div id="about-paras"></div>
          <div class="stats" id="about-stats"></div>
        </div>
      </div>
    </section>

    <section class="section perks" id="perks">
      <div class="container">
        <h2 class="center" id="perks-title"></h2>
        <div class="rule"></div>
        <div class="perks__grid" id="perks-grid"></div>
      </div>
    </section>

    <section class="section gallery" id="gallery">
      <div class="container">
        <h2 class="center" id="gallery-title"></h2>
        <div class="rule"></div>
        <div class="gallery__grid" id="gallery-grid"></div>
      </div>
    </section>

    <section class="section cta">
      <div class="container center">
        <h2 id="cta-title"></h2>
        <p id="cta-text"></p>
        <a class="btn btn--gold btn--lg" id="cta-btn" target="_blank" rel="noopener"></a>
      </div>
    </section>

    <section class="section faq" id="faq">
      <div class="container faq__wrap">
        <h2 class="center" id="faq-title"></h2>
        <div class="rule"></div>
        <div id="faq-list"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer__logo" id="footer-logo"></div>
      <div class="socials" id="socials"></div>
      <p class="footer__note" id="footer-note"></p>
      <p class="footer__copy" id="footer-copy"></p>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lightbox__nav lightbox__prev" id="lb-prev" aria-label="Previous">&#8249;</button>
    <img id="lb-img" alt="">
    <button class="lightbox__nav lightbox__next" id="lb-next" aria-label="Next">&#8250;</button>
    <div class="lightbox__cap" id="lb-cap"></div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
